<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastD Middleware Demo</title>
<style>
  :root { color-scheme: light dark; --bg:#0f172a; --card:#111827; --line:#1f2937; --text:#e5e7eb; --muted:#94a3b8; --ok:#22c55e; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:24px 20px 8px; }
  h1 { margin:0 0 6px; font-size:20px; }
  p.lead { margin:0; color:var(--muted); font-size:13px; }
  main { max-width:860px; padding:16px 20px 32px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  input { flex:1; min-width:220px; background:#0b1220; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 12px; font-size:13px; }
  button { border:1px solid var(--line); background:#1d4ed8; color:white; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; }
  button.secondary { background:transparent; color:var(--text); }
  .status { font-size:13px; padding:8px 10px; border-radius:8px; background:#0b1220; border:1px solid var(--line); }
  .status.ok { border-color:#166534; color:#4ade80; }
  .status.error { border-color:#7f1d1d; color:#f87171; }
  .headers { display:grid; grid-template-columns: max-content 1fr; gap:6px 14px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .headers dt { color:var(--muted); }
  .headers dd { margin:0; color:var(--accent); }
  pre { margin:10px 0 0; padding:12px; background:#0b1220; border:1px solid var(--line); border-radius:8px; overflow:auto; font-size:12px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>FastD Middleware Demo</h1>
  <p class="lead">路由级 <code>RequestIdMiddleware</code>：透传/生成 <code>X-Request-Id</code>，并返回 <code>X-Response-Time</code>。</p>
</header>
<main>
  <section class="card">
    <label for="requestId">自定义 X-Request-Id（留空则自动生成）</label>
    <div class="row">
      <input id="requestId" placeholder="例如: demo-request-123">
      <button id="send">发送请求</button>
      <button id="clear" class="secondary">清空</button>
    </div>
    <div id="status" class="status">等待请求</div>
  </section>
  <section class="card">
    <dl class="headers">
      <dt>X-Request-Id</dt><dd id="responseId">-</dd>
      <dt>X-Response-Time</dt><dd id="responseTime">-</dd>
    </dl>
    <pre id="body">GET /middleware-demo 后展示响应 JSON</pre>
  </section>
  <p class="lead">返回 <a href="/demo/index.html">Demo 首页</a> 或直接请求 <code>/middleware-demo</code>。</p>
</main>
<script>
(function () {
  var byId = function (id) { return document.getElementById(id); };

  function setStatus(text, kind) {
    var el = byId('status');
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function send() {
    var requestId = byId('requestId').value.trim();
    var headers = { Accept: 'application/json' };
    if (requestId) { headers['X-Request-Id'] = requestId; }

    setStatus('请求中…', '');
    try {
      var response = await fetch('/middleware-demo', { headers: headers });
      if (!response.ok) { throw new Error('HTTP ' + response.status); }

      byId('responseId').textContent = response.headers.get('X-Request-Id') || '-';
      byId('responseTime').textContent = response.headers.get('X-Response-Time') || '-';
      byId('body').textContent = JSON.stringify(await response.json(), null, 2);
      setStatus('请求成功', 'ok');
    } catch (error) {
      setStatus('请求失败：' + error.message, 'error');
    }
  }

  byId('send').addEventListener('click', send);
  byId('clear').addEventListener('click', function () {
    byId('responseId').textContent = '-';
    byId('responseTime').textContent = '-';
    byId('body').textContent = 'GET /middleware-demo 后展示响应 JSON';
    setStatus('等待请求', '');
  });
})();
</script>
</body>
</html>
