<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FastD DI Demo</title>
<style>
  :root { color-scheme: light dark; --bg:#0f172a; --card:#111827; --line:#1f2937; --text:#e5e7eb; --muted:#94a3b8; --ok:#22c55e; --accent:#38bdf8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:24px 20px 8px; }
  h1 { margin:0 0 6px; font-size:20px; }
  p.lead { margin:0; color:var(--muted); font-size:13px; }
  main { max-width:860px; padding:16px 20px 32px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  button { border:1px solid var(--line); background:#1d4ed8; color:white; border-radius:8px; padding:9px 16px; font-size:13px; cursor:pointer; }
  .status { font-size:13px; padding:8px 10px; border-radius:8px; background:#0b1220; border:1px solid var(--line); margin-top:12px; }
  .status.ok { border-color:#166534; color:#4ade80; }
  .status.error { border-color:#7f1d1d; color:#f87171; }
  dl { display:grid; grid-template-columns:max-content 1fr; gap:8px 16px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  dt { color:var(--muted); } dd { margin:0; color:var(--accent); }
  pre { margin:12px 0 0; padding:12px; background:#0b1220; border:1px solid var(--line); border-radius:8px; overflow:auto; font-size:12px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>FastD Constructor Injection Demo</h1>
  <p class="lead"><code>InjectionDemoController</code> 与 <code>InjectionDemoMiddleware</code> 的依赖由 routing resolver + <code>Container::make()</code> 注入。</p>
</header>
<main>
  <section class="card">
    <button id="send">请求 /di-demo</button>
    <div id="status" class="status">等待请求</div>
  </section>
  <section class="card">
    <dl>
      <dt>X-DI-Greeting</dt><dd id="greeting">-</dd>
      <dt>controller</dt><dd id="controller">-</dd>
      <dt>dependency</dt><dd id="dependency">-</dd>
    </dl>
    <pre id="body">点击按钮后展示响应 JSON</pre>
  </section>
  <p class="lead">返回 <a href="/demo/index.html">Demo 首页</a>，或直接请求 <code>/di-demo</code>。</p>
</main>
<script>
(function () {
  var byId = function (id) { return document.getElementById(id); };

  function setStatus(text, kind) {
    var el = byId('status');
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  async function send() {
    setStatus('请求中…');
    try {
      var response = await fetch('/di-demo', { headers: { Accept: 'application/json' } });
      if (!response.ok) { throw new Error('HTTP ' + response.status); }
      var body = await response.json();
      byId('greeting').textContent = response.headers.get('X-DI-Greeting') || '-';
      byId('controller').textContent = body.controller || '-';
      byId('dependency').textContent = body.dependency || '-';
      byId('body').textContent = JSON.stringify(body, null, 2);
      setStatus('请求成功：构造器注入生效', 'ok');
    } catch (error) {
      setStatus('请求失败：' + error.message, 'error');
    }
  }

  byId('send').addEventListener('click', send);
})();
</script>
</body>
</html>
