server {
    listen     80;
    server_name fastd;
    location / {
        proxy_pass http://127.0.0.1:9527;

        # SSE：HTTP/1.1 + 关闭代理缓冲/缓存 + 延长读超时
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        gzip off;
        chunked_transfer_encoding on;
    }
}